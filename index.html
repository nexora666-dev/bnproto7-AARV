<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Blue Nile — Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --teal: #197771;
  --primary: #28ACA3;
  --beige-light: #FAF8F1;
  --text-dark: #0A2220;
  --serif: 'Cormorant Garamond', Georgia, serif;
  --sans: 'Outfit', system-ui, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--sans);
  background: linear-gradient(135deg, var(--teal) 0%, #0D4F4A 100%);
  color: #ffffff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px;
}

.logo {
  width: 100%;
  max-width: 480px;
  margin-bottom: 40px;
  animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  opacity: 0;
  transform: translateY(20px);
  filter: brightness(0) invert(1) drop-shadow(0 4px 12px rgba(0,0,0,0.3));
}

.title {
  font-family: var(--serif);
  font-size: clamp(2.5rem, 6vw, 4.5rem);
  font-weight: 600;
  color: #ffffff;
  margin-bottom: 16px;
  line-height: 1.1;
  animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
  opacity: 0;
  transform: translateY(20px);
}

.subtitle {
  font-size: clamp(1.1rem, 2vw, 1.3rem);
  font-weight: 400;
  color: rgba(255, 255, 255, 0.8);
  max-width: 500px;
  line-height: 1.6;
  animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
  opacity: 0;
  transform: translateY(20px);
}

.divider {
  width: 60px;
  height: 3px;
  background: rgba(255, 255, 255, 0.5);
  margin: 32px auto;
  border-radius: 2px;
  animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
  opacity: 0;
  transform: translateY(20px);
}

@keyframes fadeUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
</head>
<body>

  <img src="logo_final.png" alt="Blue Nile Logo" class="logo">
  
  <h1 class="title">Something extraordinary is arriving soon.</h1>
  
  <div class="divider"></div>
  
  <p class="subtitle">
    We are currently crafting a brand new online experience for Blue Nile. 
    Our legendary flavors will soon be just a click away.
  </p>

</body>
</html>
