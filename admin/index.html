<title>Admin Panel — Blue Nile</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root {
  --teal: #197771;
  --teal-mid: #219790;
  --primary: #28ACA3;
  --primary-dark: #23948C;
  --primary-light: #E0F5F4;
  --beige-light: #FAF8F1;
  --beige-warm: #F0EDD5;
  --beige-dark: #DDD3B8;
  --white: #FFFFFF;
  --page-bg: #F7FAF9;
  --text-dark: #0A2220;
  --text-mid: #2C4D4A;
  --text-light: #6B8E8A;
  --text-muted: #A0BCBA;
  --serif: 'Cormorant Garamond', Georgia, serif;
  --sans: 'Outfit', system-ui, sans-serif;
  --ease: cubic-bezier(.16, 1, .3, 1);
  --sh-sm: 0 2px 12px rgba(10,34,32,.05);
  --sh-md: 0 8px 28px rgba(10,34,32,.08);
  --sh-lg: 0 20px 52px rgba(10,34,32,.11);
  --sh-teal: 0 10px 28px rgba(64,224,208,.20);
  --tr: all 0.35s cubic-bezier(.16,1,.3,1);
  --danger: #D32F2F;
  --danger-light: #FFEBEE;
  --warn: #E65100;
  --success: #2E7D32;
  --success-light: #E8F5E9;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--sans);
  background: var(--page-bg);
  color: var(--text-dark);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--beige-light); }
::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 8px; }

/* ═══════════════ ADMIN HEADER ═══════════════ */
.admin-header {
  background: linear-gradient(135deg, var(--teal) 0%, #0D4F4A 100%);
  padding: 20px 32px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 4px 20px rgba(10,34,32,.25);
  position: sticky; top: 0; z-index: 100;
}
.admin-header-left { display: flex; align-items: center; gap: 16px; }
.admin-header-logo {
  height: 42px; filter: brightness(0) invert(1) drop-shadow(0 2px 8px rgba(0,0,0,.2));
}
.admin-header-title {
  font-family: var(--serif); font-size: 1.5rem; font-weight: 600; color: #fff;
  display: flex; align-items: center; gap: 10px;
}
.admin-badge {
  background: rgba(64,224,208,.15); border: 1px solid rgba(64,224,208,.3);
  padding: 3px 12px; border-radius: 20px;
  font-family: var(--sans); font-size: .65rem; font-weight: 700;
  letter-spacing: .12em; text-transform: uppercase; color: var(--primary);
}
.admin-header-actions { display: flex; gap: 10px; }
.header-btn {
  padding: 8px 18px; border-radius: 10px; border: none;
  font-family: var(--sans); font-size: .82rem; font-weight: 600;
  cursor: pointer; transition: var(--tr); display: flex; align-items: center; gap: 6px;
}
.header-btn svg { width: 16px; height: 16px; }
.btn-back { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); color: #fff; }
.btn-back:hover { background: rgba(255,255,255,.2); }
.btn-save { background: var(--primary); color: var(--teal); font-weight: 700; }
.btn-save:hover { background: #40E0D0; transform: translateY(-2px); box-shadow: var(--sh-teal); }
.btn-reset { background: var(--danger); color: #fff; }
.btn-reset:hover { background: #B71C1C; }

/* ═══════════════ LAYOUT ═══════════════ */
.admin-body { display: flex; min-height: calc(100vh - 74px); }

/* ── Sidebar ── */
.sidebar {
  width: 280px; min-width: 280px;
  background: var(--white);
  border-right: 1px solid var(--beige-dark);
  padding: 20px 0;
  overflow-y: auto;
  box-shadow: var(--sh-sm);
}
.sidebar-title {
  padding: 0 20px 14px;
  font-size: .7rem; font-weight: 700;
  letter-spacing: .12em; text-transform: uppercase;
  color: var(--text-light);
  border-bottom: 1px solid var(--beige-warm);
  margin-bottom: 8px;
}
.cat-item {
  padding: 12px 20px;
  cursor: pointer; transition: var(--tr);
  display: flex; align-items: center; gap: 10px;
  border-left: 3px solid transparent;
  font-size: .88rem; font-weight: 500; color: var(--text-mid);
}
.cat-item:hover { background: var(--primary-light); color: var(--text-dark); }
.cat-item.active {
  background: var(--primary-light);
  border-left-color: var(--primary);
  color: var(--teal); font-weight: 700;
}
.cat-item .cat-count {
  margin-left: auto;
  background: var(--beige-warm); padding: 2px 8px; border-radius: 10px;
  font-size: .7rem; font-weight: 600; color: var(--text-light);
}
.cat-item.active .cat-count { background: var(--primary); color: #fff; }

/* ── Main content ── */
.content { flex: 1; padding: 28px 32px; overflow-y: auto; }

/* ── Category header bar ── */
.content-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
}
.content-title {
  font-family: var(--serif); font-size: 2rem; font-weight: 600; color: var(--text-dark);
  display: flex; align-items: center; gap: 12px;
}
.content-sub { font-size: .78rem; color: var(--text-light); font-weight: 500; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
.tool-btn {
  padding: 8px 16px; border-radius: 10px; border: 1px solid var(--beige-dark);
  background: var(--white); font-family: var(--sans); font-size: .8rem; font-weight: 600;
  color: var(--text-mid); cursor: pointer; transition: var(--tr);
  display: flex; align-items: center; gap: 6px;
}
.tool-btn:hover { border-color: var(--primary); background: var(--primary-light); color: var(--teal); transform: translateY(-2px); }
.tool-btn svg { width: 14px; height: 14px; }

/* ═══════════════ ITEM CARDS ═══════════════ */
.items-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 18px;
}
.admin-item {
  background: var(--white);
  border: 1px solid var(--beige-dark);
  border-radius: 18px; padding: 22px;
  position: relative; overflow: hidden;
  box-shadow: var(--sh-sm);
  transition: var(--tr);
}
.admin-item::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--primary), var(--primary-dark));
  opacity: 0; transition: var(--tr);
}
.admin-item:hover { box-shadow: var(--sh-md); transform: translateY(-3px); }
.admin-item:hover::before { opacity: 1; }
.admin-item.selected { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary), var(--sh-md); }

.item-top { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 14px; }
.item-photo {
  width: 80px; height: 80px; border-radius: 14px;
  background: linear-gradient(135deg, var(--teal) 0%, var(--teal-mid) 100%);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; overflow: hidden; cursor: pointer; position: relative;
  border: 2px solid rgba(64,224,208,.2); transition: var(--tr);
}
.item-photo:hover { border-color: var(--primary); transform: scale(1.05); }
.item-photo img { width: 100%; height: 100%; object-fit: cover; }
.item-photo .photo-placeholder {
  color: var(--primary); font-size: .6rem; text-align: center;
  font-weight: 600; letter-spacing: .05em;
}
.item-photo .photo-placeholder svg { width: 24px; height: 24px; display: block; margin: 0 auto 4px; }

.item-info { flex: 1; min-width: 0; }
.field-row { margin-bottom: 10px; }
.field-label {
  font-size: .65rem; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; color: var(--text-light); margin-bottom: 4px;
}
.field-input {
  width: 100%; padding: 8px 12px; border: 1px solid var(--beige-dark);
  border-radius: 8px; font-family: var(--sans); font-size: .88rem;
  color: var(--text-dark); background: var(--beige-light);
  transition: var(--tr); outline: none;
}
.field-input:focus { border-color: var(--primary); background: var(--white); box-shadow: 0 0 0 3px rgba(40,172,163,.1); }
textarea.field-input { resize: vertical; min-height: 60px; }
select.field-input { cursor: pointer; }

.field-row-inline { display: flex; gap: 10px; }
.field-row-inline .field-row { flex: 1; }

.item-actions-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding-top: 12px; border-top: 1px solid var(--beige-warm); margin-top: 4px;
}
.item-select-cb { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.item-select-cb input[type="checkbox"] {
  width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer;
}
.item-select-cb span { font-size: .75rem; color: var(--text-light); font-weight: 500; }
.action-btns { display: flex; gap: 6px; }
.action-btn {
  width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--beige-dark);
  background: var(--white); display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: var(--tr); color: var(--text-mid);
}
.action-btn:hover { border-color: var(--primary); background: var(--primary-light); color: var(--teal); }
.action-btn.danger:hover { border-color: var(--danger); background: var(--danger-light); color: var(--danger); }
.action-btn svg { width: 14px; height: 14px; }

/* ═══════════════ MOVE MODAL ═══════════════ */
.modal-overlay {
  position: fixed; inset: 0; z-index: 2000;
  background: rgba(6,22,20,.65);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  display: flex; align-items: center; justify-content: center; padding: 24px;
  opacity: 0; visibility: hidden; transition: opacity .3s var(--ease), visibility .3s var(--ease);
}
.modal-overlay.on { opacity: 1; visibility: visible; }
.modal-box {
  background: var(--white); border-radius: 22px; width: 100%; max-width: 460px;
  box-shadow: var(--sh-lg); overflow: hidden;
  transform: scale(.92) translateY(16px); transition: transform .3s var(--ease);
}
.modal-overlay.on .modal-box { transform: scale(1) translateY(0); }
.modal-box::before {
  content: ''; display: block; height: 4px;
  background: linear-gradient(90deg, transparent, var(--primary), var(--primary-dark), var(--primary), transparent);
}
.modal-header {
  padding: 20px 24px; border-bottom: 1px solid var(--beige-warm);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-header h3 { font-family: var(--serif); font-size: 1.4rem; font-weight: 600; }
.modal-close {
  width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--beige-dark);
  background: var(--white); display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: var(--tr); color: var(--text-dark);
}
.modal-close:hover { background: var(--teal); border-color: var(--teal); color: var(--primary); transform: rotate(90deg); }
.modal-close svg { width: 14px; height: 14px; }
.modal-body { padding: 20px 24px; max-height: 50vh; overflow-y: auto; }
.modal-cat-option {
  padding: 10px 16px; border-radius: 10px; cursor: pointer;
  transition: var(--tr); margin-bottom: 6px;
  font-weight: 500; color: var(--text-mid);
  border: 1px solid transparent;
}
.modal-cat-option:hover { background: var(--primary-light); border-color: var(--primary); color: var(--teal); }

/* ═══════════════ TOAST ═══════════════ */
.toast {
  position: fixed; bottom: 28px; right: 28px; z-index: 3000;
  padding: 14px 24px; border-radius: 14px;
  font-weight: 600; font-size: .88rem;
  box-shadow: var(--sh-lg);
  transform: translateY(20px); opacity: 0;
  transition: var(--tr); pointer-events: none;
}
.toast.on { transform: translateY(0); opacity: 1; pointer-events: auto; }
.toast.success { background: var(--success); color: #fff; }
.toast.error { background: var(--danger); color: #fff; }

/* ═══════════════ RESPONSIVE ═══════════════ */
@media (max-width: 900px) {
  .admin-body { flex-direction: column; }
  .sidebar { width: 100%; min-width: unset; border-right: none; border-bottom: 1px solid var(--beige-dark); display: flex; overflow-x: auto; padding: 0; }
  .sidebar-title { display: none; }
  .cat-item { border-left: none; border-bottom: 3px solid transparent; white-space: nowrap; padding: 10px 16px; }
  .cat-item.active { border-bottom-color: var(--primary); border-left-color: transparent; }
  .content { padding: 20px 16px; }
  .items-grid { grid-template-columns: 1fr; }
}
@media (max-width: 480px) {
  .admin-header { padding: 14px 16px; flex-wrap: wrap; gap: 10px; }
  .admin-header-title { font-size: 1.1rem; }
  .admin-header-actions { width: 100%; justify-content: stretch; }
  .admin-header-actions .header-btn { flex: 1; justify-content: center; }
}
</style>

</div>

let menuData = [];
let activeCatId = null;
let selectedItems = new Set(); // indices of selected items in active category

function loadData(){
  const stored = localStorage.getItem('menuData');
  if(stored){
    try { menuData = JSON.parse(stored); return; } catch(e){}
  }
  menuData = JSON.parse(JSON.stringify(DEFAULT_DATA));
}

function saveData(){
  // auto-update count fields
  menuData.forEach(cat => {
    if(cat.rows){
      cat.count = cat.rows.length + ' Items';
    }
  });
  localStorage.setItem('menuData', JSON.stringify(menuData));
}

function getRows(cat){
  if(cat.rows) return cat.rows;
  if(cat.item) return [{ n: cat.item.name, p: cat.item.price, d: cat.item.d, desc: cat.item.desc, img: cat.item.img }];
  return [];
}
function setRows(cat, rows){
  if(cat.kind === 'hero' && rows.length > 0){
    const r = rows[0];
    cat.item = { name: r.n, price: r.p, d: r.d, desc: r.desc, img: r.img, note: cat.item?.note || '', tags: cat.item?.tags || [] };
    return;
  }
  cat.rows = rows;
}

/* ── Toast ── */
function showToast(msg, type='success'){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type;
  requestAnimationFrame(()=>{ t.classList.add('on'); });
  setTimeout(()=>{ t.classList.remove('on'); }, 2400);
}

/* ── Build Sidebar ── */
function buildSidebar(){
  const sb = document.getElementById('sidebar');
  sb.innerHTML = '<div class="sidebar-title">Categories</div>';
  menuData.forEach(cat => {
    const rows = getRows(cat);
    const el = document.createElement('div');
    el.className = 'cat-item' + (cat.id === activeCatId ? ' active' : '');
    el.innerHTML = `<span>${cat.name}</span><span class="cat-count">${rows.length}</span>`;
    el.addEventListener('click', ()=>{ activeCatId = cat.id; selectedItems.clear(); buildSidebar(); buildContent(); });
    sb.appendChild(el);
  });
  
  const addBtn = document.createElement('div');
  addBtn.className = 'cat-item';
  addBtn.style = 'justify-content: center; color: var(--primary); font-weight: bold; border-top: 1px solid var(--beige-warm); margin-top: 10px; padding-top: 15px;';
  addBtn.innerHTML = `<span>+ Add Category</span>`;
  addBtn.addEventListener('click', () => {
    const name = prompt("Enter new category name:");
    if(!name || !name.trim()) return;
    const id = name.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-');
    menuData.push({
      id: id,
      name: name.trim().toUpperCase(),
      sub: "New Category",
      ico: "i-veg",
      count: "0 Items",
      rows: []
    });
    activeCatId = id;
    buildSidebar();
    buildContent();
    saveData();
    showToast("Category created");
  });
  sb.appendChild(addBtn);
}

/* ── Build Content ── */
function buildContent(){
  const cat = menuData.find(c => c.id === activeCatId);
  if(!cat){ document.getElementById('content').innerHTML = '<p style="padding:40px;color:var(--text-light);">Select a category from the sidebar.</p>'; return; }
  const rows = getRows(cat);
  const header = document.getElementById('contentHeader');
  header.innerHTML = `
    <div style="flex:1; max-width:400px; display:flex; flex-direction:column; gap:8px;">
      <input type="text" id="editCatName" value="${escHtml(cat.name)}" class="field-input" style="font-family:var(--serif); font-size:1.8rem; font-weight:600; padding:4px 8px; border:1px solid transparent; background:transparent; width:100%; border-bottom:1px solid var(--beige-dark);" placeholder="Category Name">
      <input type="text" id="editCatSub" value="${escHtml(cat.sub || '')}" class="field-input" style="font-size:0.85rem; color:var(--text-light); padding:4px 8px; border:1px solid transparent; background:transparent; width:100%; border-bottom:1px solid var(--beige-dark);" placeholder="Category Subtitle">
      <div style="font-size:0.75rem; color:var(--text-muted); padding-left:8px;">${rows.length} items (Changes to category details auto-save)</div>
    </div>
    <div class="toolbar">
      <button class="tool-btn" id="btnGenerateDB" style="background:var(--primary); color:white; border:none; font-weight:bold;">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        Generate Global DB
      </button>
      <button class="tool-btn" id="btnAddItem">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        Add Item
      </button>
      <button class="tool-btn" id="btnMoveSelected">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4M16 17H4m0 0l4 4m-4-4l4-4"/></svg>
        Move Selected
      </button>
      <button class="tool-btn" id="btnDeleteSelected" style="color:var(--danger);">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
        Delete Selected
      </button>
    </div>
  `;

  document.getElementById('btnGenerateDB').addEventListener('click', async () => {
    try {
      showToast("Generating free database...", "success");
      const res = await fetch('https://api.npoint.io/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(menuData)
      });
      const data = await res.json();
      if(data && data.id) {
        prompt("SUCCESS! Here is your free Database ID. Copy it and paste it to the AI assistant:", data.id);
      } else {
        alert("Failed to generate database. Unexpected response.");
      }
    } catch (e) {
      alert("Error creating database: " + e.message);
    }
  });

  document.getElementById('editCatName').addEventListener('change', (e) => {
    cat.name = e.target.value;
    saveData();
    buildSidebar();
  });

  document.getElementById('editCatSub').addEventListener('change', (e) => {
    cat.sub = e.target.value;
    saveData();
  });

  document.getElementById('btnAddItem').addEventListener('click', ()=>{
    const newRows = getRows(cat);
    newRows.push({ n: '', p: '', d: 'v', desc: '' });
    setRows(cat, newRows);
    buildContent();
    buildSidebar();
  });

  document.getElementById('btnMoveSelected').addEventListener('click', ()=>{
    if(selectedItems.size === 0){ showToast('Select items first', 'error'); return; }
    openMoveModal();
  });

  document.getElementById('btnDeleteSelected').addEventListener('click', ()=>{
    if(selectedItems.size === 0){ showToast('Select items first', 'error'); return; }
    if(!confirm(`Delete ${selectedItems.size} item(s)?`)) return;
    const currentRows = getRows(cat);
    const newRows = currentRows.filter((_, i) => !selectedItems.has(i));
    setRows(cat, newRows);
    selectedItems.clear();
    buildContent();
    buildSidebar();
    showToast('Items deleted');
  });

  const grid = document.getElementById('itemsGrid');
  grid.innerHTML = '';

  rows.forEach((item, idx) => {
    const card = document.createElement('div');
    card.className = 'admin-item' + (selectedItems.has(idx) ? ' selected' : '');

    card.innerHTML = `
      <div class="item-top">
        <div class="item-photo" data-idx="${idx}">
          ${item.img
            ? `<img src="${item.img}" alt="${item.n}">`
            : `<div class="photo-placeholder">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                Upload
               </div>`
          }
          <input type="file" accept="image/*" style="display:none;" data-idx="${idx}">
        </div>
        <div class="item-info">
          <div class="field-row">
            <div class="field-label">Dish Name</div>
            <input class="field-input" type="text" value="${escHtml(item.n || '')}" data-field="n" data-idx="${idx}">
          </div>
          <div class="field-row-inline">
            <div class="field-row">
              <div class="field-label">Price</div>
              <input class="field-input" type="text" value="${escHtml(item.p || '')}" data-field="p" data-idx="${idx}">
            </div>
            <div class="field-row">
              <div class="field-label">Diet</div>
              <select class="field-input" data-field="d" data-idx="${idx}">
                <option value="v" ${item.d==='v'?'selected':''}>🟢 Veg</option>
                <option value="nv" ${item.d==='nv'?'selected':''}>🔴 Non-Veg</option>
              </select>
            </div>
          </div>
        </div>
      </div>
      <div class="field-row">
        <div class="field-label">Description</div>
        <textarea class="field-input" data-field="desc" data-idx="${idx}">${escHtml(item.desc || '')}</textarea>
      </div>
      <div class="item-actions-bar">
        <label class="item-select-cb">
          <input type="checkbox" data-selidx="${idx}" ${selectedItems.has(idx)?'checked':''}>
          <span>Select</span>
        </label>
        <div class="action-btns">
          <button class="action-btn" title="Move up" data-action="up" data-idx="${idx}">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/></svg>
          </button>
          <button class="action-btn" title="Move down" data-action="down" data-idx="${idx}">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
          </button>
          <button class="action-btn" title="Move to category" data-action="move" data-idx="${idx}">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4M16 17H4m0 0l4 4m-4-4l4-4"/></svg>
          </button>
          <button class="action-btn danger" title="Delete" data-action="del" data-idx="${idx}">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
          </button>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });

  // Event delegation for grid
  grid.addEventListener('input', e => {
    const el = e.target;
    if(!el.dataset.field) return;
    const idx = parseInt(el.dataset.idx);
    const r = getRows(cat);
    if(r[idx]) r[idx][el.dataset.field] = el.value;
  });

  grid.addEventListener('change', e => {
    const el = e.target;
    // Checkbox select
    if(el.type === 'checkbox' && el.dataset.selidx !== undefined){
      const idx = parseInt(el.dataset.selidx);
      if(el.checked) selectedItems.add(idx); else selectedItems.delete(idx);
      el.closest('.admin-item').classList.toggle('selected', el.checked);
      return;
    }
    // Diet dropdown
    if(el.dataset.field === 'd'){
      const idx = parseInt(el.dataset.idx);
      const r = getRows(cat);
      if(r[idx]) r[idx].d = el.value;
      return;
    }
    // File input (photo)
    if(el.type === 'file' && el.dataset.idx !== undefined){
      const idx = parseInt(el.dataset.idx);
      const file = el.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        const r = getRows(cat);
        if(r[idx]) r[idx].img = ev.target.result;
        buildContent();
      };
      reader.readAsDataURL(file);
    }
  });

  grid.addEventListener('click', e => {
    const btn = e.target.closest('[data-action]');
    if(!btn) {
      // Check if photo area was clicked
      const photo = e.target.closest('.item-photo');
      if(photo){
        photo.querySelector('input[type="file"]').click();
      }
      return;
    }
    const action = btn.dataset.action;
    const idx = parseInt(btn.dataset.idx);
    const r = getRows(cat);

    if(action === 'del'){
      r.splice(idx, 1);
      setRows(cat, r);
      selectedItems.clear();
      buildContent(); buildSidebar();
      showToast('Item deleted');
    }
    if(action === 'up' && idx > 0){
      [r[idx-1], r[idx]] = [r[idx], r[idx-1]];
      setRows(cat, r);
      selectedItems.clear();
      buildContent();
    }
    if(action === 'down' && idx < r.length - 1){
      [r[idx], r[idx+1]] = [r[idx+1], r[idx]];
      setRows(cat, r);
      selectedItems.clear();
      buildContent();
    }
    if(action === 'move'){
      selectedItems.clear();
      selectedItems.add(idx);
      openMoveModal();
    }
  });
}

function escHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── Move Modal ── */
function openMoveModal(){
  const modal = document.getElementById('moveModal');
  const body = document.getElementById('moveModalBody');
  const count = selectedItems.size;
  document.getElementById('moveModalTitle').textContent = `Move ${count} item(s) to…`;
  body.innerHTML = '';
  menuData.forEach(cat => {
    if(cat.id === activeCatId) return;
    const opt = document.createElement('div');
    opt.className = 'modal-cat-option';
    opt.textContent = cat.name;
    opt.addEventListener('click', () => {
      const srcCat = menuData.find(c => c.id === activeCatId);
      const srcRows = getRows(srcCat);
      const targetRows = getRows(cat);
      const sortedIdxs = [...selectedItems].sort((a,b) => b - a);
      sortedIdxs.forEach(i => {
        targetRows.push(srcRows[i]);
        srcRows.splice(i, 1);
      });
      setRows(srcCat, srcRows);
      setRows(cat, targetRows);
      selectedItems.clear();
      closeMoveModal();
      buildSidebar();
      buildContent();
      showToast(`Moved to ${cat.name}`);
    });
    body.appendChild(opt);
  });
  modal.classList.add('on');
}
function closeMoveModal(){
  document.getElementById('moveModal').classList.remove('on');
}
document.getElementById('moveModalClose').addEventListener('click', closeMoveModal);
document.getElementById('moveModal').addEventListener('click', e => { if(e.target === e.currentTarget) closeMoveModal(); });

/* ── Save / Reset ── */
document.getElementById('saveBtn').addEventListener('click', ()=>{
  saveData();
  showToast('✓ All changes saved!');
});
document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(!confirm('Reset ALL menu data to the original defaults? This cannot be undone.')) return;
  localStorage.removeItem('menuData');
  menuData = JSON.parse(JSON.stringify(DEFAULT_DATA));
  activeCatId = menuData[0].id;
  selectedItems.clear();
  buildSidebar();
  buildContent();
  showToast('Menu reset to defaults');
});

/* ── ESC Key ── */
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeMoveModal();
});

/* ── Init ── */
loadData();
activeCatId = menuData[0]?.id || null;
buildSidebar();
buildContent();
</script>
</body>
</html>
